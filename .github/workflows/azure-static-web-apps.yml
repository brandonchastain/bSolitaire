name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # The deploy waits on this. The tests also run on their own workflow for pull requests;
  # they are repeated here because a job can only gate another in the same workflow, and a
  # deploy that goes out without them is the one case where it actually matters.
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Test
        run: dotnet test BSolitaire.sln -c Release --logger 'console;verbosity=normal'

  build_and_deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Published here rather than by the Static Web Apps build image, which trails
      # current .NET SDK releases.
      - name: Publish
        run: dotnet publish BSolitaire/BSolitaire.csproj -c Release -o publish

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          api_location: ''
          output_location: ''
          skip_app_build: true
