name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Published here rather than by the Static Web Apps build image, which trails
      # current .NET SDK releases.
      - name: Publish
        run: dotnet publish BSolitaire/BSolitaire.csproj -c Release -o publish

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: publish/wwwroot
          api_location: ''
          output_location: ''
          skip_app_build: true
